:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark;--bg:#f5f7fb;--card:#fff;--text:#19283e;--muted:#65738a;--border:#e1e7f0;--blue:#2468dc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#377bff0d,transparent 60%),var(--bg);color:var(--text);line-height:1.65}main{max-width:850px;margin:auto;padding:64px 26px 44px}.brand{display:flex;align-items:center;gap:14px;font-size:24px;font-weight:650}.brand img{width:54px;height:54px}h1{font-size:clamp(32px,6vw,48px);line-height:1.15;letter-spacing:-.035em;margin:32px 0 12px}.intro{font-size:18px;color:var(--muted);margin:0 0 32px}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;margin:22px 0;box-shadow:0 8px 30px #14284a04}h2{font-size:21px;margin:0 0 12px}p{color:var(--muted);margin:0 0 20px}.email{display:inline-flex;align-items:center;min-height:44px;background:var(--blue);color:white;text-decoration:none;padding:10px 18px;border-radius:11px;font-weight:600}.address{display:block;color:var(--muted);font-size:14px;margin-top:12px}details{border-top:1px solid var(--border);padding:18px 0}details:first-of-type{border-top:0}details:last-child{padding-bottom:0}summary{cursor:pointer;font-weight:600;padding:3px 0}details p{margin:12px 0 0}footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:32px}a{color:var(--blue)}a:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:5px}a:hover{text-decoration:underline}@media(prefers-color-scheme:dark){:root{--bg:#101722;--card:#192332;--text:#eff4fd;--muted:#a7b5ca;--border:#2c3a4f;--blue:#91b8ff}.email{color:#14233c}}@media(max-width:600px){main{padding-top:32px}.card{padding:22px}}

<script>
const texts={"en": {"title": "AppPeek Support", "intro": "Help with inspecting apps on your Mac.", "contact": "Contact support", "contactText": "Need a hand or found a problem? Email us with your macOS version, AppPeek version, and the steps that led to the issue. Please leave out passwords and personal information.", "email": "Email us", "privacy": "Privacy Policy", "faq": "Common questions", "questions": [["How do I start scanning?", "Open AppPeek and choose your Applications folder (/Applications). AppPeek reads application bundles without modifying them. To include apps supplied with macOS, turn on “Include system applications” in Settings."], ["How do I use Quick Look?", "Enable the AppPeek Quick Look extension in System Settings. Then select an app in Finder and press Space to preview its information."], ["How do I compare two apps?", "Click Compare and drag in two applications with the same Bundle ID. AppPeek displays their bundle information and highlights differences."], ["What does an earlier SDK mean?", "The app was built with an SDK from an earlier system generation. This does not by itself mean the app is incompatible with your Mac. Permission declarations also describe intended use, rather than permissions currently granted by macOS."]]}, "zh-Hans": {"title": "AppPeek 技术支持", "intro": "查看 Mac 应用时遇到问题？在这里获取帮助。", "contact": "联系支持", "contactText": "需要帮助或发现问题？请通过邮件告诉我们你的 macOS 版本、AppPeek 版本和问题的复现步骤。请勿附上密码或个人敏感信息。", "email": "发送邮件", "privacy": "隐私政策", "faq": "常见问题", "questions": [["如何开始扫描？", "打开 AppPeek，选择“应用程序”文件夹（/Applications）。AppPeek 只读取应用程序包，不会修改其中的应用。如需包含 macOS 自带应用，可在设置中开启“包含系统应用程序”。"], ["如何使用快速查看？", "在系统设置中启用 AppPeek 的快速查看扩展，然后在 Finder 中选中一个应用程序，按空格键即可预览它的信息。"], ["如何对比两个应用？", "点击“对比”，拖入两个 Bundle ID 相同的应用程序。AppPeek 会展示包信息并标出差异。"], ["“使用较早 SDK”是什么意思？", "该应用使用较早系统代际的 SDK 构建。这本身不代表应用无法在你的 Mac 上运行。权限声明同样表示应用计划如何使用权限，并不代表 macOS 当前已授予这些权限。"]]}, "ja": {"title": "AppPeek サポート", "intro": "Macのアプリの調査についてお困りですか？", "contact": "サポートに問い合わせる", "contactText": "ご質問や不具合はメールでお知らせください。macOSとAppPeekのバージョン、問題が発生するまでの手順をお書き添えください。パスワードや個人情報は含めないでください。", "email": "メールを送る", "privacy": "プライバシーポリシー", "faq": "よくある質問", "questions": [["スキャンを始めるには？", "AppPeekを開き、アプリケーションフォルダ（/Applications）を選択します。アプリのバンドルを読み取るだけで、変更は加えません。macOSに付属するアプリも含めるには、設定で「システムアプリを含める」をオンにします。"], ["クイックルックを使うには？", "システム設定でAppPeekのクイックルック拡張機能を有効にします。Finderでアプリを選択してスペースキーを押すと、情報をプレビューできます。"], ["2つのアプリを比較するには？", "「比較」をクリックし、Bundle IDが同じ2つのアプリをドラッグします。AppPeekがバンドル情報を表示し、相違点を強調します。"], ["古いSDKを使用しているとは？", "そのアプリが以前のシステム世代のSDKでビルドされたことを意味します。これだけでMac上で動作しないとは限りません。権限の宣言も用途を示すものであり、macOSで現在許可されている権限を示すものではありません。"]]}, "ko": {"title": "AppPeek 지원", "intro": "Mac 앱을 살펴보는 데 도움이 필요하신가요?", "contact": "지원 문의", "contactText": "궁금한 점이나 문제가 있다면 이메일로 알려 주세요. macOS 및 AppPeek 버전과 문제가 발생한 과정을 적어 주세요. 암호나 민감한 개인 정보는 포함하지 마세요.", "email": "이메일 보내기", "privacy": "개인정보 처리방침", "faq": "자주 묻는 질문", "questions": [["스캔을 시작하려면 어떻게 하나요?", "AppPeek을 열고 응용 프로그램 폴더(/Applications)를 선택하세요. 앱 번들을 읽기만 하며 앱을 수정하지 않습니다. macOS에 기본으로 설치된 앱도 포함하려면 설정에서 “시스템 앱 포함”을 켜세요."], ["훑어보기는 어떻게 사용하나요?", "시스템 설정에서 AppPeek 훑어보기 확장 프로그램을 활성화하세요. Finder에서 앱을 선택하고 스페이스 바를 누르면 정보를 미리 볼 수 있습니다."], ["두 앱을 어떻게 비교하나요?", "“비교”를 클릭하고 Bundle ID가 같은 앱 두 개를 드래그하세요. AppPeek이 번들 정보를 표시하고 차이점을 강조합니다."], ["이전 SDK를 사용한다는 것은 무슨 뜻인가요?", "이전 시스템 세대의 SDK로 빌드된 앱이라는 뜻입니다. 이것만으로 Mac에서 실행할 수 없다는 뜻은 아닙니다. 권한 선언도 사용 목적을 설명하며, macOS가 현재 부여한 권한을 나타내지는 않습니다."]]}, "fr": {"title": "Assistance AppPeek", "intro": "Besoin d’aide pour examiner les apps de votre Mac ?", "contact": "Contacter l’assistance", "contactText": "Une question ou un problème ? Écrivez-nous en précisant les versions de macOS et d’AppPeek, ainsi que les étapes permettant de reproduire le problème. N’incluez pas de mots de passe ni de données personnelles sensibles.", "email": "Nous écrire", "privacy": "Politique de confidentialité", "faq": "Questions fréquentes", "questions": [["Comment lancer une analyse ?", "Ouvrez AppPeek et choisissez le dossier Applications (/Applications). AppPeek lit les paquets des apps sans les modifier. Pour inclure les apps fournies avec macOS, activez « Inclure les applications système » dans les réglages."], ["Comment utiliser Coup d’œil ?", "Activez l’extension Coup d’œil d’AppPeek dans Réglages Système. Sélectionnez ensuite une app dans le Finder et appuyez sur la barre d’espace pour voir ses informations."], ["Comment comparer deux apps ?", "Cliquez sur Comparer et faites glisser deux apps ayant le même Bundle ID. AppPeek affiche les informations de leurs paquets et met les différences en évidence."], ["Que signifie l’utilisation d’un ancien SDK ?", "L’app a été compilée avec un SDK d’une génération de système antérieure. Cela ne signifie pas à lui seul qu’elle est incompatible avec votre Mac. Les déclarations d’autorisations décrivent leur usage prévu, et non les autorisations actuellement accordées par macOS."]]}, "de": {"title": "AppPeek Support", "intro": "Hilfe beim Untersuchen der Apps auf deinem Mac.", "contact": "Support kontaktieren", "contactText": "Du hast eine Frage oder ein Problem entdeckt? Schreib uns eine E-Mail mit deiner macOS- und AppPeek-Version und den Schritten, mit denen das Problem auftritt. Bitte füge keine Passwörter oder sensiblen persönlichen Daten hinzu.", "email": "E-Mail schreiben", "privacy": "Datenschutzerklärung", "faq": "Häufige Fragen", "questions": [["Wie starte ich einen Scan?", "Öffne AppPeek und wähle den Programme-Ordner (/Applications). AppPeek liest die App-Pakete, ohne sie zu verändern. Um die mit macOS gelieferten Apps einzubeziehen, aktiviere „Systemapps einbeziehen“ in den Einstellungen."], ["Wie verwende ich die Schnellvorschau?", "Aktiviere die Schnellvorschau-Erweiterung von AppPeek in den Systemeinstellungen. Wähle dann im Finder eine App aus und drücke die Leertaste, um ihre Informationen anzusehen."], ["Wie vergleiche ich zwei Apps?", "Klicke auf Vergleichen und ziehe zwei Apps mit derselben Bundle ID in das Fenster. AppPeek zeigt ihre Paketinformationen und hebt Unterschiede hervor."], ["Was bedeutet ein älteres SDK?", "Die App wurde mit einem SDK einer früheren Systemgeneration erstellt. Das allein bedeutet nicht, dass sie mit deinem Mac inkompatibel ist. Berechtigungsdeklarationen beschreiben ebenfalls den vorgesehenen Zugriff und nicht die aktuell von macOS erteilten Berechtigungen."]]}, "es": {"title": "Soporte de AppPeek", "intro": "Ayuda para inspeccionar las apps de tu Mac.", "contact": "Contactar con soporte", "contactText": "¿Tienes una pregunta o has encontrado un problema? Escríbenos con las versiones de macOS y AppPeek y los pasos para reproducirlo. No incluyas contraseñas ni información personal sensible.", "email": "Enviar un correo", "privacy": "Política de privacidad", "faq": "Preguntas frecuentes", "questions": [["¿Cómo inicio un análisis?", "Abre AppPeek y selecciona la carpeta Aplicaciones (/Applications). AppPeek lee los paquetes de las apps sin modificarlos. Para incluir las apps que vienen con macOS, activa «Incluir apps del sistema» en Ajustes."], ["¿Cómo uso Vista rápida?", "Activa la extensión Vista rápida de AppPeek en Ajustes del Sistema. Después, selecciona una app en el Finder y pulsa la barra espaciadora para ver su información."], ["¿Cómo comparo dos apps?", "Haz clic en Comparar y arrastra dos apps con el mismo Bundle ID. AppPeek muestra la información de sus paquetes y resalta las diferencias."], ["¿Qué significa usar un SDK anterior?", "La app se compiló con un SDK de una generación anterior del sistema. Esto por sí solo no significa que sea incompatible con tu Mac. Las declaraciones de permisos describen el uso previsto, no los permisos que macOS ha concedido actualmente."]]}, "it": {"title": "Supporto AppPeek", "intro": "Aiuto per esaminare le app sul tuo Mac.", "contact": "Contatta il supporto", "contactText": "Hai una domanda o hai riscontrato un problema? Scrivici indicando le versioni di macOS e AppPeek e i passaggi per riprodurre il problema. Non includere password o dati personali sensibili.", "email": "Invia un’email", "privacy": "Informativa sulla privacy", "faq": "Domande frequenti", "questions": [["Come avvio una scansione?", "Apri AppPeek e scegli la cartella Applicazioni (/Applications). AppPeek legge i pacchetti delle app senza modificarli. Per includere le app fornite con macOS, attiva “Includi le app di sistema” nelle Impostazioni."], ["Come uso Visualizzazione rapida?", "Attiva l’estensione Visualizzazione rapida di AppPeek nelle Impostazioni di Sistema. Quindi seleziona un’app nel Finder e premi la barra spaziatrice per visualizzarne le informazioni."], ["Come confronto due app?", "Fai clic su Confronta e trascina due app con lo stesso Bundle ID. AppPeek mostra le informazioni dei pacchetti ed evidenzia le differenze."], ["Cosa significa usare un SDK precedente?", "L’app è stata compilata con un SDK di una generazione precedente del sistema. Questo da solo non significa che sia incompatibile con il Mac. Anche le dichiarazioni dei permessi descrivono l’uso previsto, non i permessi attualmente concessi da macOS."]]}};
