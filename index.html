  <title>Privacy Policy · AppPeek</title>
  <style>
    :root { font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans",sans-serif; color-scheme:light dark; --bg:#f5f6f8; --surface:#fff; --ink:#202634; --muted:#657084; --line:#e4e8ef; --blue:#2867dc; --blue-soft:#e9f0ff; }
    @media (prefers-color-scheme:dark) { :root { --bg:#11151d; --surface:#1a202b; --ink:#f0f3f8; --muted:#adb7c7; --line:#303847; --blue:#8caeff; --blue-soft:#263955; } }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--bg); color:var(--ink); line-height:1.72; }
    a { color:var(--blue); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .topbar { background:color-mix(in srgb,var(--surface) 88%,transparent); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:2; backdrop-filter:blur(20px) saturate(150%); }
    .top-inner { max-width:1060px; margin:auto; padding:14px 28px; display:flex; align-items:center; }
    .brand { display:flex; align-items:center; gap:12px; color:var(--ink); font-weight:720; letter-spacing:-.02em; }
    .brand img { width:38px; height:38px; border-radius:10px; box-shadow:0 4px 12px #183e8b2e; }
    .shell { max-width:1060px; margin:auto; padding:66px 28px 88px; display:grid; grid-template-columns:214px minmax(0,1fr); gap:68px; }
    aside { position:sticky; top:94px; align-self:start; }
    aside small { display:block; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; margin:5px 0 14px; }
    aside a { display:block; padding:7px 12px; margin-left:-12px; color:var(--muted); border-radius:8px; font-size:14px; }
    aside a:hover { background:var(--blue-soft); color:var(--blue); text-decoration:none; }
    .eyebrow { color:var(--blue); font-weight:720; font-size:12px; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:13px 0 12px; font-size:clamp(38px,6vw,58px); line-height:1.12; letter-spacing:-.052em; }
    .lead { color:var(--muted); font-size:17px; margin:0 0 28px; max-width:690px; }
    .meta { display:flex; flex-wrap:wrap; gap:10px 28px; color:var(--muted); font-size:13px; padding-bottom:32px; border-bottom:1px solid var(--line); }
    section { scroll-margin-top:84px; padding:29px 0 30px; border-bottom:1px solid var(--line); }
    section h2 { margin:0 0 10px; font-size:21px; letter-spacing:-.025em; }
    section p { color:var(--muted); margin:0 0 12px; max-width:710px; }
    section p:last-child { margin-bottom:0; }
    .contact { display:inline-block; margin-top:4px; font-weight:650; }
    footer { color:var(--muted); font-size:12px; padding-top:30px; }
    @media(max-width:720px) { .shell { display:block; padding:44px 22px 66px; } aside { display:none; } .top-inner { padding:12px 22px; } h1 { margin-top:9px; } }
  </style>

  <script>
    const policies = {
      en: {
        title:"Privacy Policy", lead:"How AppPeek handles information about the apps you choose to inspect.", nav:"On this page", date:"Effective date: October 1, 2026", product:"Applies to: AppPeek for macOS",
        sections:[
          ["overview","Overview",["AppPeek is a macOS utility for inspecting application bundles and comparing two applications that share the same Bundle ID. This policy explains what AppPeek reads, why it reads it, and what remains on your Mac.","AppPeek performs its analysis locally. It does not require an account and does not use advertising, tracking, or analytics services."]],
          ["access","Information AppPeek reads",["When you select a folder or application, AppPeek may read application metadata, Info.plist values, executable headers and architectures, linked frameworks and library clues, code-signing information, entitlements, privacy manifests, localizations, Launch Services declarations, nested components, file listings, modification dates, icons, and package size.","The Quick Look extension reads the selected application bundle to create the preview you request. AppPeek does not read documents inside unrelated locations unless you select or authorize those locations."]],
          ["use","How information is used",["The information is used only to display application details, search and filter the scanned library, compare two application bundles with the same Bundle ID, and generate Quick Look previews.","AppPeek does not use the inspected information to identify you, build a profile, serve advertising, or make automated decisions about you."]],
          ["storage","Local storage and retention",["Scan, inspection, comparison, and preview results are processed on your device. AppPeek may store your appearance preference, other app settings, and a security-scoped bookmark for a folder you authorize so that access can be restored later.","macOS may cache Quick Look previews according to system behavior. You can clear AppPeek settings by removing the app's data, select another folder in Settings, and manage Quick Look extensions in System Settings."]],
          ["network","Network access and third parties",["AppPeek does not upload application metadata, bundle contents, scan results, or comparison results to a server. It includes no third-party advertising or analytics SDK.","The app opens this privacy-policy page or your email client only when you choose the corresponding link. This page is hosted on GitHub Pages, so visiting it is subject to GitHub's handling of ordinary web request data."]],
          ["control","Folder access and your choices",["AppPeek is sandboxed. It requests access when you choose an application folder or application bundle, explains what to select, and uses that access to inspect the selected content without modifying it.","You can stop using an authorized folder by choosing a different folder, removing AppPeek's saved data, or uninstalling AppPeek. You can enable or disable the Quick Look extension in System Settings."]],
          ["children","Children's privacy",["AppPeek does not offer accounts or online social features and does not knowingly collect personal information from children."]],
          ["contact","Changes and contact",["This policy may be updated when AppPeek's features or data practices change. The effective date above will be revised when a new version is published.","For privacy questions or feedback, contact:"]]
        ], email:"heziboite@outlook.com"
      },
      "zh-Hans": {
        title:"隐私协议", lead:"了解 AppPeek 如何处理您选择查看的应用程序信息。", nav:"本页内容", date:"生效日期：2026 年 10 月 1 日", product:"适用产品：AppPeek macOS 应用",
        sections:[
          ["overview","概述",["AppPeek 是一款用于检查应用程序包，并对比两个具有相同 Bundle ID 的应用程序的 macOS 工具。本协议说明 AppPeek 会读取哪些信息、读取这些信息的目的，以及哪些内容会保留在您的 Mac 上。","AppPeek 在本机完成分析。使用时无需账户，应用也不包含广告、跟踪或使用情况分析服务。"]],
          ["access","AppPeek 读取的信息",["当您选择文件夹或应用程序时，AppPeek 可能读取应用程序元数据、Info.plist 值、可执行文件头与架构、链接的框架和程序库线索、代码签名信息、Entitlements、隐私清单、本地化资源、Launch Services 声明、嵌套组件、文件列表、修改时间、图标及安装包大小。","快速查看扩展会读取您选中的应用程序包，以生成您请求的预览。除非您主动选择或授权其他位置，否则 AppPeek 不会读取无关位置中的文稿。"]],
          ["use","信息用途",["这些信息只用于展示应用程序详情、搜索和筛选已扫描的应用库、对比两个具有相同 Bundle ID 的应用程序包，以及生成快速查看预览。","AppPeek 不会利用检查到的信息识别您的身份、建立用户画像、投放广告或对您作出自动化决定。"]],
          ["storage","本地存储与保留",["扫描、检查、对比和预览结果均在您的设备上处理。AppPeek 可能在本机保存外观偏好、其他应用设置，以及您所授权文件夹的安全范围书签，以便以后恢复访问。","macOS 可能根据系统行为缓存快速查看预览。您可以通过移除 AppPeek 的应用数据来清除设置，也可以在设置中选择其他文件夹，并在系统设置中管理快速查看扩展。"]],
          ["network","网络访问与第三方",["AppPeek 不会向服务器上传应用程序元数据、包内容、扫描结果或对比结果，也不包含第三方广告或分析 SDK。","只有当您主动点击相应链接时，应用才会打开本隐私协议网页或您的邮件客户端。本网页托管于 GitHub Pages，因此访问网页时产生的常规网络请求数据由 GitHub 按其规则处理。"]],
          ["control","文件夹访问与您的选择",["AppPeek 启用了 App Sandbox。您选择应用程序文件夹或应用程序包时，AppPeek 会请求访问权限并说明应选择的内容，随后仅使用该权限检查所选内容，不会修改其中的应用程序。","您可以改选其他文件夹、移除 AppPeek 保存的数据或卸载 AppPeek，以停止使用此前授权的文件夹；也可以在系统设置中启用或停用快速查看扩展。"]],
          ["children","儿童隐私",["AppPeek 不提供账户或在线社交功能，也不会在知情的情况下收集儿童的个人信息。"]],
          ["contact","变更与联系",["如果 AppPeek 的功能或信息处理方式发生变化，本协议可能会更新。发布新版本时，上方的生效日期也会相应修改。","如有隐私问题或反馈，请联系："]]
        ], email:"heziboite@outlook.com"
      },
      ja: {
        title:"プライバシーポリシー", lead:"AppPeekが、選択したアプリの情報をどのように取り扱うかを説明します。", nav:"このページの内容", date:"施行日：2026年10月1日", product:"対象製品：AppPeek for macOS",
        sections:[
          ["overview","概要",["AppPeekは、アプリケーションバンドルの確認と、同じBundle IDを持つ2つのアプリの比較を行うmacOSユーティリティです。本ポリシーでは、AppPeekが読み取る情報、その目的、Macに保存される内容について説明します。","分析はMac上で行われます。アカウントは不要で、広告、トラッキング、利用状況分析サービスは使用しません。"]],
          ["access","読み取る情報",["フォルダまたはアプリを選択すると、アプリのメタデータ、Info.plist、実行ファイルのヘッダとアーキテクチャ、リンクされたフレームワークとライブラリの手掛かり、コード署名、Entitlements、プライバシーマニフェスト、ローカライズ、Launch Services宣言、内包コンポーネント、ファイル一覧、更新日時、アイコン、パッケージサイズを読み取る場合があります。","Quick Look拡張機能は、要求されたプレビューを作成するため、選択したアプリケーションバンドルを読み取ります。ユーザーが選択または許可していない場所の書類は読み取りません。"]],
          ["use","利用目的",["情報は、アプリの詳細表示、スキャン済みライブラリの検索と絞り込み、同じBundle IDを持つ2つのアプリの比較、Quick Lookプレビューの生成にのみ使用します。","本人の識別、プロファイリング、広告配信、自動化された判断には使用しません。"]],
          ["storage","ローカル保存と保持",["スキャン、確認、比較、プレビューの結果は端末上で処理されます。外観設定などのアプリ設定と、許可したフォルダへのアクセスを復元するためのセキュリティスコープ付きブックマークをMacに保存する場合があります。","macOSはシステムの動作に従いQuick Lookプレビューをキャッシュすることがあります。アプリデータの削除、設定でのフォルダ変更、システム設定での拡張機能管理が可能です。"]],
          ["network","通信と第三者",["アプリのメタデータ、バンドル内容、スキャン結果、比較結果をサーバーへ送信しません。第三者の広告SDKや分析SDKも含みません。","該当するリンクを選んだ場合に限り、本ページまたはメールアプリを開きます。本ページはGitHub Pagesでホストされているため、閲覧時の通常のWebリクエストデータはGitHubの取り扱いに従います。"]],
          ["control","フォルダへのアクセスと選択",["AppPeekはApp Sandboxを使用します。フォルダまたはアプリを選ぶとアクセス許可を求め、選択内容を変更せずに確認します。","別のフォルダの選択、AppPeekの保存データの削除、アンインストールにより、以前許可したフォルダの使用を停止できます。Quick Look拡張機能はシステム設定で管理できます。"]],
          ["children","子どものプライバシー",["AppPeekはアカウントやオンラインのソーシャル機能を提供せず、子どもの個人情報を意図的に収集しません。"]],
          ["contact","変更とお問い合わせ",["機能または情報の取り扱いが変わった場合、本ポリシーを更新することがあります。更新時には施行日を変更します。","プライバシーに関するご質問やフィードバック："]]
        ], email:"heziboite@outlook.com"

    function preferredLocale() {
      for (const language of (navigator.languages || [navigator.language])) {
        const tag = language.toLowerCase();
        if (tag === "zh-hans" || tag.startsWith("zh-hans-") || tag === "zh-cn" || tag === "zh-sg") return "zh-Hans";
        const base = tag.split("-")[0];
        if (["en","ja","ko","fr","de","es","it"].includes(base)) return base;
      }
      return "en";
    }
    const locale = preferredLocale();
    const policy = policies[locale] || policies.en;
    document.documentElement.lang = locale;
    document.title = `${policy.title} · AppPeek`;
    const navigation = document.getElementById("navigation");
    navigation.innerHTML = `<small>${policy.nav}</small>${policy.sections.map(([id,title]) => `<a href="#${id}">${title}</a>`).join("")}`;
    const sections = policy.sections.map(([id,title,paragraphs]) => `<section id="${id}"><h2>${title}</h2>${paragraphs.map(text => `<p>${text}</p>`).join("")}${id === "contact" ? `<a class="contact" href="mailto:${policy.email}">${policy.email}</a>` : ""}</section>`).join("");
    document.getElementById("policy").innerHTML = `<div class="eyebrow">AppPeek · Privacy</div><h1>${policy.title}</h1><p class="lead">${policy.lead}</p><div class="meta"><span>${policy.date}</span><span>${policy.product}</span></div>${sections}<footer>© 2026 AppPeek</footer>`;
